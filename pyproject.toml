[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobsearch"
version = "0.0.0"
description = "Job search scraper and supporting utilities"
requires-python = ">=3.12"
dependencies = [
    "attrs==23.1.0",
    "beautifulsoup4==4.12.2",
    "bs4==0.0.1",
    "certifi==2023.7.22",
    "cffi==1.16.0",
    "charset-normalizer==3.3.2",
    "exceptiongroup==1.1.3",
    "h11==0.14.0",
    "idna==3.4",
    "outcome==1.3.0.post0",
    "pycparser==2.21",
    "pyodbc==5.0.1",
    "PySocks==1.7.1",
    "requests==2.31.0",
    "selenium==4.15.2",
    "sniffio==1.3.0",
    "sortedcontainers==2.4.0",
    "soupsieve==2.5",
    "trio==0.23.1",
    "trio-websocket==0.11.1",
    "urllib3==2.0.7",
    "wsproto==1.2.0",
    "SQLAlchemy==2.0.46",
    "psutil==7.2.2",
    "openpyxl==3.1.5",
    "pytest==8.3.5",
    "pandas==3.0.0",
]

[project.scripts]
jobsearch = "main:main"

[tool.setuptools]
include-package-data = true
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["scraper_module*"]
exclude = [
    "analysis*",
    "copilot*",
    "data_migration*",
    "db_migrations*",
    "job_metadata*",
    "job_metadata_old*",
    "scripts*",
    "spreadsheet*",
    "tests*",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
ignore = [
    "E501",
]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"